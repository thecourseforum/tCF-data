name: Update course data

on:
  workflow_dispatch:
    inputs:
      term:
        description: "SIS term code. Leave blank to use today's date."
        required: false
        type: string
      descriptions:
        description: "Refresh every catalog description. A blank result is not written."
        required: false
        type: boolean
        default: false
  # Edit this cron to change the time. This runs once a day at 07:30 UTC.
  schedule:
    - cron: "30 7 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Fetch the SIS term
        id: fetch
        env:
          TERM: ${{ inputs.term }}
          DESCRIPTIONS: ${{ inputs.descriptions }}
        run: |
          pip install requests
          args=()
          if [ "$DESCRIPTIONS" = "true" ]; then
            args+=(--descriptions)
          fi
          if [ -n "$TERM" ]; then
            args+=("$TERM")
          fi
          python fetch_page.py "${args[@]}"

      - name: Commit if the snapshot changed
        env:
          TERM: ${{ steps.fetch.outputs.term }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet --exit-code data/; then
            echo "No changes."
          else
            git add data/
            git commit -m "[Automated]: update ${TERM}"
            git push
          fi
