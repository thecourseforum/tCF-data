name: Update course data

on:
  workflow_dispatch:
    inputs:
      term:
        description: "SIS term code (for example 1268)"
        required: true
        type: string
  # Edit this cron to change the time. This runs once a day at 07:30 UTC.
  schedule:
    - cron: "30 7 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch the SIS term
        env:
          # Scheduled runs have no input. Change 1268 for another term.
          TERM: ${{ inputs.term || '1268' }}
        run: python fetch_page.py "$TERM"

      - name: Commit if the snapshot changed
        env:
          TERM: ${{ inputs.term || '1268' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet --exit-code data/; then
            echo "No changes."
          else
            git add data/
            git commit -m "[Automated]: update ${TERM}"
            git push
          fi
