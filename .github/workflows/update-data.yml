name: Update course data

on:
  workflow_dispatch:
    inputs:
      term:
        description: "SIS term code. Leave blank to use today's date."
        required: false
        type: string
      descriptions:
        description: "Refresh every catalog description. A blank result is not written."
        required: false
        type: boolean
        default: false
  # Edit this cron to change the time. This runs once a day at 07:30 UTC.
  schedule:
    - cron: "30 7 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --no-dev --no-install-project

      - name: Fetch the SIS term
        id: fetch
        env:
          TERM: ${{ inputs.term }}
          DESCRIPTIONS: ${{ inputs.descriptions }}
        run: |
          uv run --no-sync python -m unittest test_fetch_page.py
          args=()
          if [ "$DESCRIPTIONS" = "true" ]; then
            args+=(--descriptions)
          fi
          if [ -n "$TERM" ]; then
            args+=("$TERM")
          fi
          uv run --no-sync python fetch_page.py "${args[@]}"

      - name: Commit if the snapshot changed
        env:
          TERM: ${{ steps.fetch.outputs.term }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet --exit-code data/; then
            echo "No changes."
          else
            git add data/
            git commit -m "[Automated]: update ${TERM}"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push
          fi
