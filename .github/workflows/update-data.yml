name: Update course data

on:
  workflow_dispatch:
    inputs:
      term:
        description: "SIS term code (for example 1268)"
        required: true
        type: string
  # The every-two-hours schedule stays off. Start this workflow by hand from Actions.
  # schedule:
  #   - cron: "0 */2 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch the SIS term
        env:
          TERM: ${{ inputs.term }}
        run: python fetch_page.py "$TERM"

      - name: Commit if the snapshot changed
        env:
          TERM: ${{ inputs.term }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet --exit-code data/; then
            echo "No changes."
          else
            git add data/
            git commit -m "[Automated]: update ${TERM}"
            git push
          fi
